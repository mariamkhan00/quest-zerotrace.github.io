<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Editor - ZeroTrace</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background: #f4f7fb; font-family: 'Segoe UI', sans-serif; }
  .navbar { background: #0A1929; }
  .table-container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); margin-top: 30px; }
</style>
</head>
<body>

<nav class="navbar navbar-dark px-3 py-3">
  <span class="navbar-brand mb-0 h1">Chairman Dashboard - Live Editor</span>
  <button class="btn btn-danger btn-sm" onclick="logout()">Logout</button>
</nav>

<div class="container table-container">
  <h4 class="mb-3 text-primary">Update Live Timetable Data</h4>
  <div class="table-responsive">
    <table class="table table-bordered table-hover" id="dataTable">
      <thead class="table-dark">
        <tr>
          <th>Batch</th><th>Day</th><th>Start</th><th>End</th><th>Subject</th><th>Teacher</th><th>Room</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="7" class="text-center">Loading Data...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  // Login Check
  if (localStorage.getItem('isAdminLoggedIn') !== 'true') {
    window.location.href = 'login.html';
  }

  function logout() {
    localStorage.removeItem('isAdminLoggedIn');
    window.location.href = 'login.html';
  }

  // Yahan apna NAYA URL daalein (Jo aapne deploy kiya hai)
  const API_URL = "https://script.google.com/macros/s/AKfycbxnC6yvLX7bii8KGFAL6SHgsRUds4AjZo1Vu-V9wpnqh2lwIGE0DeadBPB_gVx9sfJ7rw/exec";

  // Sheet se Data Load Karo
  async function loadData() {
    try {
      const response = await fetch(API_URL + "?action=getLiveTimetable");
      const data = await response.json();
      
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = ""; // Purana clear karo

      if (data.length === 0) {
        tbody.innerHTML = "<tr><td colspan='7' class='text-center'>No data found</td></tr>";
        return;
      }

      data.forEach(row => {
        tbody.innerHTML += `
          <tr>
            <td>${row.batch}</td>
            <td>${row.day}</td>
            <td>${row.start}</td>
            <td>${row.end}</td>
            <td>${row.subject}</td>
            <td>${row.teacher}</td>
            <td>${row.room}</td>
          </tr>
        `;
      });
    } catch (error) {
      document.getElementById('tableBody').innerHTML = "<tr><td colspan='7' class='text-center text-danger'>Error Loading Data!</td></tr>";
    }
  }

  // Page load hote hi data lao
  loadData();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Data Editor - ZeroTrace</title>
<style>
  body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
  .header { background: #0A1929; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
  .header h3 { margin: 0; font-size: 1.2rem; }
  .logout-btn { background: #dc3545; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
  .logout-btn:hover { background: #c82333; }
  iframe { width: 100%; height: calc(100% - 60px); border: none; }
</style>
</head>
<body>

<div class="header">
  <h3><i class="fas fa-lock"></i> Chairman Access: Live Database</h3>
  <button class="logout-btn" onclick="logout()">Logout</button>
</div>

<!-- Yahan Google Sheet khulegi (Bina kisi link error ke) -->
<iframe src="https://docs.google.com/spreadsheets/d/1GnD0lgc0P6EnD_7G5SOIWNvqcMIqIup0T1ZBQIAaDJI/edit?usp=sharing&rm=minimal"></iframe>

<script>
  // Agar Chairman login nahi hai, toh wapas login page par bhej do
  if (localStorage.getItem('isAdminLoggedIn') !== 'true') {
    window.location.href = 'login.html';
  }

  function logout() {
    localStorage.removeItem('isAdminLoggedIn');
    window.location.href = 'login.html';
  }
</script>

</body>
</html>

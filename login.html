<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - QUEST Cyber Security</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
body { background-color: #0A1929; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', sans-serif; }
.login-card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 15px 50px rgba(0,0,0,0.5); width: 100%; max-width: 400px; }
.login-card img { width: 80px; margin-bottom: 20px; }
.login-card h3 { font-weight: 700; color: #0A1929; margin-bottom: 30px; text-align: center; }
.form-control { padding: 12px 15px; border-radius: 8px; margin-bottom: 15px; }
.btn-login { background: #0B72B9; color: white; width: 100%; padding: 12px; border-radius: 8px; font-weight: 700; border: none; transition: 0.3s; }
.btn-login:hover { background: #0A1929; color: white; }
.error-msg { color: red; font-size: 0.9rem; text-align: center; margin-top: 10px; display: none; }
</style>
</head>
<body>

<div class="login-card">
  <div class="text-center">
    <img src="https://i.ibb.co/HfBDmCbn/quest-logo.jpg" alt="Logo">
  </div>
  <h3>Chairman Login</h3>
  
  <form id="loginForm">
    <input type="email" id="email" class="form-control" placeholder="Enter Email" required>
    <input type="password" id="password" class="form-control" placeholder="Enter Password" required>
    <button type="submit" class="btn-login">Login</button>
    <p id="errorMsg" class="error-msg"></p>
  </form>
  
  <div class="text-center mt-3">
    <a href="index.html" style="color: #666; font-size: 0.9rem; text-decoration: none;">&larr; Back to Website</a>
  </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const errorMsg = document.getElementById('errorMsg');
  
  errorMsg.style.display = 'none';
  
  // Yahan apna naya Apps Script URL daalein
  const API_URL = "https://script.google.com/macros/s/AKfycbzG3YcMyDxCAiCUg6jXK019t8Q4a83U3gtVtYxm1NJVoWYZPPtsNgCvy2iTXp0AyLyztA/exec";
  
  try {
    const response = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'login', email: email, password: password })
    });
    
    const data = await response.json();
    
    if (data.success) {
      // Login successful - Admin page par bhejo
      localStorage.setItem('isAdminLoggedIn', 'true'); // Session save
      window.location.href = 'admin.html'; 
    } else {
      errorMsg.innerText = data.message;
      errorMsg.style.display = 'block';
    }
  } catch (error) {
    errorMsg.innerText = "Server error. Please try again.";
    errorMsg.style.display = 'block';
  }
});
</script>

</body>
</html>
